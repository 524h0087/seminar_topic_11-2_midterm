method: PUT
body:
  type: json
  content: "{\r

    \    \"name\": \"Elon Ma\",\r

    \    \"email\": \"jack@example.com\",\r

    \    \"major\": \"Information Systems\",\r

    \    \"gpa\": 9.0\r

    }"
